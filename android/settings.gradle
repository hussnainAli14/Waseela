pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex ->
    def nodeBinary = settings.hasProperty('NODE_BINARY') ? settings.NODE_BINARY : null
    def npxCommand = "npx"
    if (nodeBinary) {
        def nodeFile = new File(nodeBinary)
        def binDir = nodeFile.parentFile
        def npxFile = new File(binDir, "npx")
        if (npxFile.exists()) {
            npxCommand = npxFile.absolutePath
        }
    }
    ex.autolinkLibrariesFromCommand([npxCommand, "@react-native-community/cli", "config"])
}
rootProject.name = 'Waseela'

include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// Set REACT_NATIVE_NODE_MODULES_DIR before projects are evaluated
// This prevents react-native-gesture-handler from calling node
def reactNativeDir = file("../node_modules/react-native").absolutePath
gradle.beforeProject { project ->
    project.ext.REACT_NATIVE_NODE_MODULES_DIR = reactNativeDir
}


include ':react-native-worklets'
project(':react-native-worklets').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-worklets/android')