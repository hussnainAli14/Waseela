buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Set REACT_NATIVE_NODE_MODULES_DIR early to prevent react-native-gesture-handler from calling node
// This must be set before any subprojects are evaluated
project.ext.REACT_NATIVE_NODE_MODULES_DIR = file("${project.projectDir}/../node_modules/react-native").absolutePath

// Configure Node.js path for React Native packages
def nodeExecutable = project.findProperty('NODE_BINARY') ?: '/opt/homebrew/bin/node'

// Verify node exists
def nodeFile = new File(nodeExecutable)
if (!nodeFile.exists()) {
    throw new GradleException("Node.js not found at ${nodeExecutable}. Please install Node.js or set NODE_BINARY in gradle.properties")
}

// Set node executable as project property for all subprojects
project.ext.nodeExecutable = nodeExecutable
project.ext.NODE_BINARY = nodeExecutable

// Configure all subprojects to use the node executable and REACT_NATIVE_NODE_MODULES_DIR
subprojects {
    ext.NODE_BINARY = rootProject.ext.NODE_BINARY
    ext.nodeExecutable = rootProject.ext.nodeExecutable
    ext.REACT_NATIVE_NODE_MODULES_DIR = rootProject.ext.REACT_NATIVE_NODE_MODULES_DIR
}
